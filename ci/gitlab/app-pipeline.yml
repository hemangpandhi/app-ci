      coverage_report:
        coverage_format: cobertura
        path: reports/app/coverage/cobertura.xml
  timeout: 3h
  coverage: '/Total line coverage: (\d+(?:\.\d+)?)%/'
  before_script:
  - test -n "$APPCI_PLATFORM" && test -n "$APPCI_IMAGE" || { echo "set APPCI_PLATFORM and APPCI_IMAGE"; exit 1; }
