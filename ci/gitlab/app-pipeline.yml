  - $APPCI_HOME/bin/appci workspace --app "$APPCI_APP"
  script:
  - $APPCI_HOME/bin/appci run --app "$APPCI_APP" --stages deploy --report-dir "$APPCI_REPORT_DIR" --ci --slug app --checkout
    "$CI_PROJECT_DIR" --checkout-ref HEAD
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
    - reports/app/deploy/
    - reports/app/results/deploy.json
    - reports/app/gl-code-quality-report.json
    - reports/app/profile.json
    - reports/app/changeset.json
    - reports/app/impact.json
pages:
  stage: pages
  tags:
  - appci-${APPCI_PLATFORM}
  needs:
  - job: report
    artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
  - test -f public/index.html
  artifacts:
    paths:
    - public/
    expire_in: 2 weeks
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
