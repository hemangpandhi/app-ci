  - $APPCI_HOME/bin/appci report --report-dir "$APPCI_REPORT_DIR"
  - rm -rf public && cp -r "$APPCI_REPORT_DIR" public
  artifacts:
    when: always
    expire_in: 2 weeks
    expose_as: appci dashboard
    paths:
    - reports/
    - public/
    reports:
      codequality:
      - reports/app/gl-code-quality-report.json
deploy:
  stage: deploy
  tags:
  - appci-${APPCI_PLATFORM}
  interruptible: false
  timeout: 8h
  resource_group: appci-tree-${APPCI_PLATFORM}
  rules:
  - if: $CI_COMMIT_TAG
  before_script:
  - test -n "$APPCI_PLATFORM" && test -n "$APPCI_IMAGE" || { echo "set APPCI_PLATFORM and APPCI_IMAGE"; exit 1; }
  - rm -rf "$APPCI_HOME" && git clone -q --depth 1 --branch "$APPCI_VERSION" "${APPCI_SOURCE:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${APPCI_PROJECT}.git}"
