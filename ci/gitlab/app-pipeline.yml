# appci pipeline for an app's own GitLab project.
# GENERATED by `bin/appci gitlab --out ci/gitlab/app-pipeline.yml`; edit appci.yaml / gitlab.py, not this file.
#
# Use it from the app repository's .gitlab-ci.yml:
#
#   include:
#     - project: 'tools/aosp-app-ci'
#       ref: v1.0.0                           # pin a release
#       file: '/ci/gitlab/app-pipeline.yml'
#   variables:
#     APPCI_APP: packages/apps/Car/Settings   # path of the app inside the AOSP tree
#     APPCI_PLATFORM: tangorpro               # platform in appci.yaml (manifest, lunch targets)
#     APPCI_IMAGE: platforms/tangorpro:latest   # platform image on the runner (/build_env/.repo)
#     APPCI_VERSION: v1.0.0                   # appci ref the jobs run (same as include ref)
#
# Every job: clone appci at $APPCI_VERSION (job token; allow this project in aosp-app-ci
# Settings > CI/CD > Job token permissions), `appci workspace` (repo init/sync of the
# platform tree on the runner volume, seeded once from the image's /build_env/.repo), then the
# stage, with the commit under test checked out into the tree. Manifest settings can be
# overridden with APPCI_MANIFEST_URL/_BRANCH/_FILE/_GROUPS CI variables. Private git servers:
# masked APPCI_GIT_CREDENTIALS = "https://user:token@host ..." (or a File variable), stored
# in the job container's git credential store only.
# Emulator image for device tests: prebuilt from Artifactory, APPCI_EMULATOR_IMAGE_URL = folder
# with RELEASE_*.zip (newest is used, cached on the volume; APPCI_EMULATOR_PROGRAM_URL for the
# emulator itself, APPCI_ARTIFACTORY_TOKEN when it needs auth). Without it: build the image with
# the emulator_image job (schedule with APPCI_EMULATOR_IMAGE=true, or start it by hand).
#
# Runner (docker executor), see ci/docker/runner-config.toml: tags appci-<platform>
# (+ appci-<platform>-kvm for device tests), volume <host dir>:/appci, devices /dev/kvm.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger|parent_pipeline)$/
stages:
- check
- build
- analyze
- test
- device
- coverage
- quality
- docs
- report
- deploy
- pages
variables:
  APPCI_REPORT_DIR: $CI_PROJECT_DIR/reports
  APPCI_PLATFORM: ''
  APPCI_IMAGE: ''
  APPCI_VERSION: main
  APPCI_PROJECT: tools/aosp-app-ci
  APPCI_HOME: /tmp/appci-$CI_JOB_ID
  APPCI_TOOLS_CACHE: /appci/.tools
  APPCI_WORKSPACE: /appci/{platform}
  GIT_DEPTH: '0'
default:
  interruptible: true
  image: $APPCI_IMAGE
preupload:
  stage: check
  tags:
  - appci-${APPCI_PLATFORM}
  resource_group: appci-tree-${APPCI_PLATFORM}
  needs: []
  script:
  - $APPCI_HOME/bin/appci run --app "$APPCI_APP" --stages preupload --report-dir "$APPCI_REPORT_DIR" --ci --slug app --checkout
    "$CI_PROJECT_DIR" --checkout-ref HEAD
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
    - reports/app/preupload/
    - reports/app/results/preupload.json
    - reports/app/gl-code-quality-report.json
    - reports/app/profile.json
    - reports/app/changeset.json
    - reports/app/impact.json
    reports:
      codequality: reports/app/gl-code-quality-report.json
  timeout: 3h
  before_script:
  - test -n "$APPCI_PLATFORM" && test -n "$APPCI_IMAGE" || { echo "set APPCI_PLATFORM and APPCI_IMAGE"; exit 1; }
  - rm -rf "$APPCI_HOME" && git clone -q --depth 1 --branch "$APPCI_VERSION" "${APPCI_SOURCE:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${APPCI_PROJECT}.git}"
    "$APPCI_HOME"
  - git -C "$APPCI_HOME" remote remove origin
  - echo "appci $(git -C "$APPCI_HOME" describe --tags --always) on $(python3 --version), $(git --version), uid $(id -u)"
  - $APPCI_HOME/bin/appci workspace --app "$APPCI_APP"
build:
  stage: build
  tags:
  - appci-${APPCI_PLATFORM}
  resource_group: appci-tree-${APPCI_PLATFORM}
  needs: []
  script:
  - $APPCI_HOME/bin/appci run --app "$APPCI_APP" --stages build --report-dir "$APPCI_REPORT_DIR" --ci --slug app --checkout
    "$CI_PROJECT_DIR" --checkout-ref HEAD
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
    - reports/app/build/
    - reports/app/results/build.json
    - reports/app/gl-code-quality-report.json
    - reports/app/profile.json
    - reports/app/changeset.json
    - reports/app/impact.json
  timeout: 8h
  before_script:
  - test -n "$APPCI_PLATFORM" && test -n "$APPCI_IMAGE" || { echo "set APPCI_PLATFORM and APPCI_IMAGE"; exit 1; }
  - rm -rf "$APPCI_HOME" && git clone -q --depth 1 --branch "$APPCI_VERSION" "${APPCI_SOURCE:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${APPCI_PROJECT}.git}"
    "$APPCI_HOME"
  - git -C "$APPCI_HOME" remote remove origin
  - echo "appci $(git -C "$APPCI_HOME" describe --tags --always) on $(python3 --version), $(git --version), uid $(id -u)"
  - $APPCI_HOME/bin/appci workspace --app "$APPCI_APP"
risk:
  stage: analyze
  tags:
  - appci-${APPCI_PLATFORM}
  resource_group: appci-tree-${APPCI_PLATFORM}
  needs:
  - job: build
    artifacts: true
  script:
  - $APPCI_HOME/bin/appci fetch-baseline --job build --out "$CI_PROJECT_DIR/baseline" || true
  - export APPCI_BASELINE_DIR="$CI_PROJECT_DIR/baseline/reports"
  - $APPCI_HOME/bin/appci run --app "$APPCI_APP" --stages risk --report-dir "$APPCI_REPORT_DIR" --ci --slug app --checkout
    "$CI_PROJECT_DIR" --checkout-ref HEAD
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
    - reports/app/risk/
    - reports/app/results/risk.json
    - reports/app/gl-code-quality-report.json
    - reports/app/profile.json
    - reports/app/changeset.json
    - reports/app/impact.json
    reports:
      codequality: reports/app/gl-code-quality-report.json
  timeout: 3h
  before_script:
  - test -n "$APPCI_PLATFORM" && test -n "$APPCI_IMAGE" || { echo "set APPCI_PLATFORM and APPCI_IMAGE"; exit 1; }
  - rm -rf "$APPCI_HOME" && git clone -q --depth 1 --branch "$APPCI_VERSION" "${APPCI_SOURCE:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${APPCI_PROJECT}.git}"
