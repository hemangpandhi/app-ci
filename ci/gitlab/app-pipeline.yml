  script:
  - $APPCI_HOME/bin/appci run --app "$APPCI_APP" --stages coverage --report-dir "$APPCI_REPORT_DIR" --ci --slug app --checkout
    "$CI_PROJECT_DIR" --checkout-ref HEAD
